name: ScheduleDensityApp
# 버전·빌드번호의 단일 소스 (→ Config/Version.xcconfig).
# DeployBar 가 배포할 때 이 파일만 고쳐 버전을 올린다 (deploy.env 의 VERSION_XCCONFIG).
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

options:
  # ⚠️ App Store에 이미 배포된 번들 ID다. 절대 바꾸지 말 것 —
  #    번들 ID를 바꾸면 기존 앱의 업데이트가 아니라 별개의 새 앱이 되어
  #    기존 사용자에게 도달하지 못한다. (placeholder 도메인처럼 보이지만 그대로 유지)
  bundleIdPrefix: com.example
  # 개발 언어(= 기기 언어가 지원 밖일 때 iOS 가 고르는 표)는 영어다.
  # xcstrings 의 sourceLanguage(ko — 키가 한국어 문장)와는 별개다: 한국어 표는 키로 채워지고,
  # 지원하지 않는 언어의 사용자는 한국어가 아니라 영어를 본다. ko 로 되돌리지 말 것.
  # 각 타깃 Info.plist 의 CFBundleDevelopmentRegion 도 en 이다.
  # ⚠️ knownRegions 는 여기 적지 않는다 — xcodegen 이 .xcstrings 를 읽어 스스로 채운다
  #    (전에 적어 봤는데 조용히 무시됐다). 언어를 늘리는 자리는 그 파일 하나뿐이다.
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
# 빌드에 안 들어가지만 Xcode 파일 목록에서는 보여야 하는 것 (맥 스킴이 경로로만 가리킨다).
fileGroups:
  - macOS/WeekBlocks.storekit
packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 3.44.1
settings:
  base:
# ⚠️ MARKETING_VERSION 과 CURRENT_PROJECT_VERSION 은 **여기 두지 않는다.**
    #    Config/Version.xcconfig 한 곳에서만 정한다 — 타겟이 셋이라 흩어지면
    #    번들끼리 버전이 어긋나 업로드가 거절된다. 프로젝트 설정은 xcconfig 보다
    #    우선하므로, 여기 되살리는 순간 그 파일이 조용히 무시된다.
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
# ⚠️ 스킴을 여기 적어둔다. xcodegen이 프로젝트를 다시 만들 때 xcshareddata를 지우므로,
# 명시해두지 않으면 재생성할 때마다 Xcode·xcodebuild가 스킴을 못 찾는다.
schemes:
  ScheduleDensityApp:
    build:
      targets:
        ScheduleDensityApp: all
    run:
      config: Debug
      # 시뮬레이터에서 결제를 시험하는 데 쓰는 로컬 상품 목록.
      # 실제 값·이름은 App Store Connect의 것이 이긴다 (여기 값은 개발용 흉내다).
      storeKitConfiguration: ScheduleDensityApp/Products.storekit
    test:
      config: Debug
      # 단위 시험(핵심 계산·계약)과 UI 시험(핵심 흐름 + 접근성 자동 점검).
      targets:
        - ScheduleDensityAppTests
        - ScheduleDensityAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # 맥 앱 '무지개 공방' (같은 번들 ID · 한 레코드 · 유니버설 구매). 코드는 macOS/ 아래.
  WeekBlocks:
    build:
      targets:
        WeekBlocks: all
    run:
      config: Debug
      # 로컬에서 구매 흐름을 굴려보는 가짜 스토어. Release/archive 에는 안 붙는다.
      storeKitConfiguration: macOS/WeekBlocks.storekit
    test:
      config: Debug
      # UI 시험은 `-uiTesting` 으로 띄워 메모리 안 스토어로만 돈다 (→ macOS/WeekBlocks/LaunchEnvironment.swift).
      targets:
        - WeekBlocksTests
        - WeekBlocksUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  ScheduleDensityApp:
    type: application
    platform: iOS
    sources:
      # ⚠️ 제외 목록을 두지 않는다. 예전에 깨진 화면 5개를 excludes로 숨겨뒀는데,
      #    목록이 유일한 방어선이라 재생성 한 번에 빌드가 깨졌다.
      #    안 쓰는 화면은 지우고, 남긴 화면은 컴파일되게 고쳐서 전부 타깃에 넣는다.
      - path: ScheduleDensityApp
        # AppIcon.icon 은 소스 폴더가 아니라 한 덩어리 아이콘 파일이다 — 아래에서 따로 넣는다.
        excludes:
          - AppIcon.icon
      # Icon Composer 유리 아이콘 (iOS 26+). 이름이 AppIcon 이라 ASSETCATALOG_COMPILER_APPICON_NAME 이 그대로 고른다.
      # 그보다 아래 iOS 는 Assets.xcassets/AppIcon.appiconset 의 평면 그림을 쓴다 — 둘 다 scripts/make_app_icon.py 가 만든다.
      - path: ScheduleDensityApp/AppIcon.icon
        type: file
        buildPhase: resources
      # 아이폰 · 맥이 함께 쓰는 파일 (데이터 모델 · iCloud 표 · 금고). 한 벌뿐이다.
      - path: Shared
    dependencies:
      - package: LeeoKit
      - target: TodoWidgetExtension
      - target: TodoShareExtension
    settings:
      base:
        # ⚠️ 배포된 앱의 번들 ID. 변경 금지(위 bundleIdPrefix 주석 참조).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScheduleDensityApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "욕망의 무지개"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: ScheduleDensityApp/ScheduleDensityApp.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"ScheduleDensityApp/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ⚠️ ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME은 두지 않는다.
        #    Assets.xcassets에 AccentColor 색상 세트가 없어 "not present in any
        #    asset catalogs" 경고만 났다. 설정이 없어도 틴트는 똑같은 시스템 기본
        #    파랑이므로, 색을 새로 굽는 대신 가리키는 곳 없는 설정을 지운다.
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        # 맥에는 맥 앱(무지개 공방, 같은 번들 ID)이 따로 있다. 아이폰 앱이 맥에서
        # 'Designed for iPhone · iPad'로 뜨지 않게 막는다 (Xcode 실행 대상에서도 사라진다).
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  # 홈 화면·잠금 화면 위젯 (할 일 + 무지개).
  # 앱이 App Group에 구워둔 스냅샷만 읽으므로 CloudKit/LeeoKit 의존성은 없다.
  TodoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoWidget
      # 앱과 함께 쓰는 파일만 골라 넣는다 (SwiftData 모델은 위젯에 필요 없다).
      - path: ScheduleDensityApp/Shared/TodoWidgetSnapshot.swift
      - path: ScheduleDensityApp/Shared/RainbowWidgetSnapshot.swift
      - path: Shared/ColorHex.swift
      # 제어센터 컨트롤이 앱에 '적을 준비 해둬'를 건네는 통로. 인텐트가 앱 타깃과
      # 위젯 타깃 양쪽에 있어야 하므로(→ QuickTodoControl.swift), 통로도 양쪽에 든다.
      - path: ScheduleDensityApp/Shared/QuickTodoBridge.swift
      # 위젯은 값을 받고 여는 것 중 하나다. 익스텐션은 결제를 조회할 수 없으므로
      # 앱이 App Group에 구워둔 한 줄만 읽는다 (StoreKit은 앱 쪽에만 있다).
      - path: ScheduleDensityApp/Shared/ProEntitlement.swift
      # 잠금화면 타이머가 주고받는 값의 모양. 그리는 쪽(위젯)과 보내는 쪽(앱)이
      # 같은 타입을 알아야 해서 양쪽 타깃에 든다 (→ TimerActivity.swift).
      - path: ScheduleDensityApp/Shared/TimerActivity.swift
      # 홈·잠금 화면 타이머 위젯이 읽는 스냅샷 (→ TimerWidgetSnapshot.swift).
      - path: ScheduleDensityApp/Shared/TimerWidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.TodoWidget
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "할 일"
        CODE_SIGN_ENTITLEMENTS: TodoWidget/TodoWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # 다른 앱의 공유 시트에서 '욕망의 무지개'를 고르면 뜨는 작은 창.
  # SwiftData store는 앱 샌드박스 안이라 못 여니, App Group의 '받은 상자'에만 적어둔다
  # (앱이 켜질 때 가져간다 → TodoShareInbox.swift). CloudKit/LeeoKit 의존성은 없다.
  TodoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoShare
      # 앱과 함께 쓰는 파일만 골라 넣는다.
      - path: Shared/TodoShareInbox.swift
      - path: Shared/AppLog.swift
      # TodoLabel 정의. 모델에 얹힌 확장은 BacklogItem+Label.swift로 떼어냈으므로
      # 이 파일만으로 충분하다 (SwiftData 모델이 따라오지 않는다).
      - path: ScheduleDensityApp/Shared/TodoSplitAdvisor.swift
      # formatDuration, Date.currentWeekStart
      - path: Shared/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.TodoShare
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "할 일로"
        CODE_SIGN_ENTITLEMENTS: TodoShare/TodoShare.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # 단위 시험 — 무지개 밀도·할 일 단계 같은 핵심 계산과, 출시 전에 어긋나면 안 되는 약속
  # (LeeoKit 계약 감사 · 새 기능 안내 · 퍼널 · 원격 스위치 이름). 앱을 호스트로 돈다.
  ScheduleDensityAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScheduleDensityAppTests
    dependencies:
      - target: ScheduleDensityApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScheduleDensityApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ScheduleDensityApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  # UI 시험 — 실제로 띄워 할 일 적기 → 무지개 → 설정을 돌고, 화면마다 접근성 자동 점검을 한다.
  ScheduleDensityAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScheduleDensityAppUITests
    dependencies:
      - target: ScheduleDensityApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScheduleDensityApp
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  # ───────────────────────────── macOS ─────────────────────────────
  # 맥 앱 '무지개 공방'. 아이폰과 같은 번들 ID · 같은 iCloud · 같은 영수증 (한 레코드 · 유니버설 구매).
  # 코드는 macOS/ 아래. 버전은 아이폰과 하나다 (→ Config/Version.xcconfig, DeployBar 가 두 바퀴 모두 이것으로 낸다).

  WeekBlocks:
    type: application
    platform: macOS
    sources:
      - path: macOS/WeekBlocks
      - path: Shared
    dependencies:
      - package: LeeoKit
      - target: MacTodoShareExtension
      - target: TimerWidgetExtension
    # **권한 창 앞에 '허용'을 세우지 않는다** (→ macOS/scripts/check-permission-wording.sh).
    # 1.1.3(15)이 캘린더 단추 "Allow calendar access" 하나로 5.1.1(iv) 거절을 받았다.
    preBuildScripts:
      - name: 권한 문구 검사 (App Review 5.1.1(iv))
        script: '"$SRCROOT/macOS/scripts/check-permission-wording.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: 한국어 원문 표 넣기
        script: '"$SRCROOT/macOS/scripts/source-language-strings.py" "$SRCROOT/macOS/WeekBlocks/Localizable.xcstrings" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ko.lproj/Localizable.strings"'
        inputFiles:
          - $(SRCROOT)/macOS/scripts/source-language-strings.py
          - $(SRCROOT)/macOS/WeekBlocks/Localizable.xcstrings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ko.lproj/Localizable.strings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp
        # ⚠️ 번들 이름이 곧 사람이 찾는 이름이다 (스포트라이트는 파일명 · CFBundleName 으로 찾는다).
        PRODUCT_NAME: "무지개 공방"
        # 실행 파일 · 모듈 이름은 ASCII 로 못박는다 (크래시 리포트 · ps · 로그 필터).
        EXECUTABLE_NAME: WeekBlocks
        PRODUCT_MODULE_NAME: WeekBlocks
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: macOS/WeekBlocks/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "무지개 공방"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: macOS/WeekBlocks/WeekBlocks.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  # 맥 공유 메뉴의 '무지개 공방'. 아이폰 TodoShareExtension 과 짝이다 — 같이 고칠 것.
  # 타깃 이름만 Mac 을 붙여 가르고, 번들(.appex) 이름은 예전 그대로 둔다.
  MacTodoShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: macOS/TodoShare
      - path: Shared/TodoShareInbox.swift
      - path: Shared/AppLog.swift
      - path: macOS/WeekBlocks/Motion.swift
      - path: macOS/WeekBlocks/TodoSplitAdvisor.swift
      - path: Shared/Models.swift
    postBuildScripts:
      - name: 한국어 원문 표 넣기
        script: '"$SRCROOT/macOS/scripts/source-language-strings.py" "$SRCROOT/macOS/TodoShare/Localizable.xcstrings" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ko.lproj/Localizable.strings"'
        inputFiles:
          - $(SRCROOT)/macOS/scripts/source-language-strings.py
          - $(SRCROOT)/macOS/TodoShare/Localizable.xcstrings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ko.lproj/Localizable.strings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.TodoShare
        PRODUCT_NAME: TodoShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: macOS/TodoShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/TodoShare/TodoShare.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  # 맥 바탕화면 · 알림 센터의 지금 타이머. 앱이 App Group 에 적어 둔 오늘의 타임라인만 읽는다.
  TimerWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: macOS/TimerWidget
      - path: macOS/WeekBlocks/TimerWidgetSnapshot.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    postBuildScripts:
      - name: 한국어 원문 표 넣기
        script: '"$SRCROOT/macOS/scripts/source-language-strings.py" "$SRCROOT/macOS/TimerWidget/Localizable.xcstrings" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ko.lproj/Localizable.strings"'
        inputFiles:
          - $(SRCROOT)/macOS/scripts/source-language-strings.py
          - $(SRCROOT)/macOS/TimerWidget/Localizable.xcstrings
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ko.lproj/Localizable.strings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.TimerWidget
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: macOS/TimerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/TimerWidget/TimerWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  # 맥 핵심 로직 · 계약 단위 시험. 숙주는 창도 디스크 스토어도 세우지 않는다 (→ LaunchEnvironment.isUnitTestHost).
  WeekBlocksTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macOS/WeekBlocksTests
    dependencies:
      - target: WeekBlocks
      - package: LeeoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.Tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/무지개 공방.app/Contents/MacOS/WeekBlocks"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # 맥 실행 → 한 바퀴 → 손쉬운 사용 자동 점검.
  WeekBlocksUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: macOS/WeekBlocksUITests
    dependencies:
      - target: WeekBlocks
