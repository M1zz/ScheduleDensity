name: ScheduleDensityApp
options:
  bundleIdPrefix: com.devkoan
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 2.6.0
settings:
  base:
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  ScheduleDensityApp:
    type: application
    platform: iOS
    sources:
      - path: ScheduleDensityApp
        excludes:
          - "Views/WeekView.swift"
          - "Views/RecommendationView.swift"
          - "Views/DensityChartView.swift"
          - "Views/WeekDensityView.swift"
          - "Views/InsightCardsView.swift"
    dependencies:
      - package: LeeoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devkoan.ScheduleDensityApp
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScheduleDensityApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "욕망의 무지개"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: ScheduleDensityApp/ScheduleDensityApp.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"ScheduleDensityApp/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
