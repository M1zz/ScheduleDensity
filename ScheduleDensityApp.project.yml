name: ScheduleDensityApp
# 버전·빌드번호의 단일 소스 (→ Config/Version.xcconfig).
# DeployBar 가 배포할 때 이 파일만 고쳐 버전을 올린다 (deploy.env 의 VERSION_XCCONFIG).
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

options:
  # ⚠️ App Store에 이미 배포된 번들 ID다. 절대 바꾸지 말 것 —
  #    번들 ID를 바꾸면 기존 앱의 업데이트가 아니라 별개의 새 앱이 되어
  #    기존 사용자에게 도달하지 못한다. (placeholder 도메인처럼 보이지만 그대로 유지)
  bundleIdPrefix: com.example
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 3.5.1
settings:
  base:
# ⚠️ MARKETING_VERSION 과 CURRENT_PROJECT_VERSION 은 **여기 두지 않는다.**
    #    Config/Version.xcconfig 한 곳에서만 정한다 — 타겟이 셋이라 흩어지면
    #    번들끼리 버전이 어긋나 업로드가 거절된다. 프로젝트 설정은 xcconfig 보다
    #    우선하므로, 여기 되살리는 순간 그 파일이 조용히 무시된다.
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
# ⚠️ 스킴을 여기 적어둔다. xcodegen이 프로젝트를 다시 만들 때 xcshareddata를 지우므로,
# 명시해두지 않으면 재생성할 때마다 Xcode·xcodebuild가 스킴을 못 찾는다.
schemes:
  ScheduleDensityApp:
    build:
      targets:
        ScheduleDensityApp: all
    run:
      config: Debug
      # 시뮬레이터에서 결제를 시험하는 데 쓰는 로컬 상품 목록.
      # 실제 값·이름은 App Store Connect의 것이 이긴다 (여기 값은 개발용 흉내다).
      storeKitConfiguration: ScheduleDensityApp/Products.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  ScheduleDensityApp:
    type: application
    platform: iOS
    sources:
      # ⚠️ 제외 목록을 두지 않는다. 예전에 깨진 화면 5개를 excludes로 숨겨뒀는데,
      #    목록이 유일한 방어선이라 재생성 한 번에 빌드가 깨졌다.
      #    안 쓰는 화면은 지우고, 남긴 화면은 컴파일되게 고쳐서 전부 타깃에 넣는다.
      - path: ScheduleDensityApp
    dependencies:
      - package: LeeoKit
      - target: TodoWidgetExtension
      - target: TodoShareExtension
    settings:
      base:
        # ⚠️ 배포된 앱의 번들 ID. 변경 금지(위 bundleIdPrefix 주석 참조).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScheduleDensityApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "욕망의 무지개"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: ScheduleDensityApp/ScheduleDensityApp.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"ScheduleDensityApp/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ⚠️ ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME은 두지 않는다.
        #    Assets.xcassets에 AccentColor 색상 세트가 없어 "not present in any
        #    asset catalogs" 경고만 났다. 설정이 없어도 틴트는 똑같은 시스템 기본
        #    파랑이므로, 색을 새로 굽는 대신 가리키는 곳 없는 설정을 지운다.
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  # 홈 화면·잠금 화면 위젯 (할 일 + 무지개).
  # 앱이 App Group에 구워둔 스냅샷만 읽으므로 CloudKit/LeeoKit 의존성은 없다.
  TodoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoWidget
      # 앱과 함께 쓰는 파일만 골라 넣는다 (SwiftData 모델은 위젯에 필요 없다).
      - path: ScheduleDensityApp/Shared/TodoWidgetSnapshot.swift
      - path: ScheduleDensityApp/Shared/RainbowWidgetSnapshot.swift
      - path: ScheduleDensityApp/Shared/ColorHex.swift
      # 제어센터 컨트롤이 앱에 '적을 준비 해둬'를 건네는 통로. 인텐트가 앱 타깃과
      # 위젯 타깃 양쪽에 있어야 하므로(→ QuickTodoControl.swift), 통로도 양쪽에 든다.
      - path: ScheduleDensityApp/Shared/QuickTodoBridge.swift
      # 위젯은 값을 받고 여는 것 중 하나다. 익스텐션은 결제를 조회할 수 없으므로
      # 앱이 App Group에 구워둔 한 줄만 읽는다 (StoreKit은 앱 쪽에만 있다).
      - path: ScheduleDensityApp/Shared/ProEntitlement.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.TodoWidget
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "할 일"
        CODE_SIGN_ENTITLEMENTS: TodoWidget/TodoWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # 다른 앱의 공유 시트에서 '욕망의 무지개'를 고르면 뜨는 작은 창.
  # SwiftData store는 앱 샌드박스 안이라 못 여니, App Group의 '받은 상자'에만 적어둔다
  # (앱이 켜질 때 가져간다 → TodoShareInbox.swift). CloudKit/LeeoKit 의존성은 없다.
  TodoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoShare
      # 앱과 함께 쓰는 파일만 골라 넣는다.
      - path: ScheduleDensityApp/Shared/TodoShareInbox.swift
      # TodoLabel 정의. 모델에 얹힌 확장은 BacklogItem+Label.swift로 떼어냈으므로
      # 이 파일만으로 충분하다 (SwiftData 모델이 따라오지 않는다).
      - path: ScheduleDensityApp/Shared/TodoSplitAdvisor.swift
      # formatDuration, Date.currentWeekStart
      - path: ScheduleDensityApp/Shared/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.TodoShare
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "할 일로"
        CODE_SIGN_ENTITLEMENTS: TodoShare/TodoShare.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
