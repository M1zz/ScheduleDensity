name: ScheduleDensityApp
options:
  # ⚠️ App Store에 이미 배포된 번들 ID다. 절대 바꾸지 말 것 —
  #    번들 ID를 바꾸면 기존 앱의 업데이트가 아니라 별개의 새 앱이 되어
  #    기존 사용자에게 도달하지 못한다. (placeholder 도메인처럼 보이지만 그대로 유지)
  bundleIdPrefix: com.example
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 2.6.0
settings:
  base:
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "8"
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
# ⚠️ 스킴을 여기 적어둔다. xcodegen이 프로젝트를 다시 만들 때 xcshareddata를 지우므로,
# 명시해두지 않으면 재생성할 때마다 Xcode·xcodebuild가 스킴을 못 찾는다.
schemes:
  ScheduleDensityApp:
    build:
      targets:
        ScheduleDensityApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  ScheduleDensityApp:
    type: application
    platform: iOS
    sources:
      - path: ScheduleDensityApp
        excludes:
          - "Views/WeekView.swift"
          - "Views/RecommendationView.swift"
          - "Views/DensityChartView.swift"
          - "Views/WeekDensityView.swift"
          - "Views/InsightCardsView.swift"
    dependencies:
      - package: LeeoKit
      - target: TodoWidgetExtension
      - target: TodoShareExtension
    settings:
      base:
        # ⚠️ 배포된 앱의 번들 ID. 변경 금지(위 bundleIdPrefix 주석 참조).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScheduleDensityApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "욕망의 무지개"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: ScheduleDensityApp/ScheduleDensityApp.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: "\"ScheduleDensityApp/Preview Content\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  # 홈 화면·잠금 화면 할 일 위젯.
  # 앱이 App Group에 구워둔 스냅샷만 읽으므로 CloudKit/LeeoKit 의존성은 없다.
  TodoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoWidget
      # 앱과 함께 쓰는 파일만 골라 넣는다 (SwiftData 모델은 위젯에 필요 없다).
      - path: ScheduleDensityApp/Shared/TodoWidgetSnapshot.swift
      - path: ScheduleDensityApp/Shared/ColorHex.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.TodoWidget
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "할 일"
        CODE_SIGN_ENTITLEMENTS: TodoWidget/TodoWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # 다른 앱의 공유 시트에서 '욕망의 무지개'를 고르면 뜨는 작은 창.
  # SwiftData store는 앱 샌드박스 안이라 못 여니, App Group의 '받은 상자'에만 적어둔다
  # (앱이 켜질 때 가져간다 → TodoShareInbox.swift). CloudKit/LeeoKit 의존성은 없다.
  TodoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoShare
      # 앱과 함께 쓰는 파일만 골라 넣는다.
      - path: ScheduleDensityApp/Shared/TodoShareInbox.swift
      - path: ScheduleDensityApp/Shared/TodoLabelChip.swift
      # TodoLabel 정의. 모델에 얹힌 확장은 BacklogItem+Label.swift로 떼어냈으므로
      # 이 파일만으로 충분하다 (SwiftData 모델이 따라오지 않는다).
      - path: ScheduleDensityApp/Shared/TodoSplitAdvisor.swift
      # formatDuration, Date.currentWeekStart
      - path: ScheduleDensityApp/Shared/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleDensityApp.TodoShare
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoShare/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "할 일로"
        CODE_SIGN_ENTITLEMENTS: TodoShare/TodoShare.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
