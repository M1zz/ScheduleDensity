<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>App Store screenshots — en-US</title>
<style>
/* ─────────────────────────────────────────────────────────────
   App Store screenshots (English) for "Rainbow of Desire".

   Authoring size: 430 x 932 CSS px  ->  rendered at deviceScaleFactor 3
   = 1290 x 2796 px, the 6.9" iPhone size Apple accepts for every iPhone.

   The phone screen inside each frame is authored at real iOS point
   sizes (393 x 852 = iPhone 16 Pro) and scaled down, so paddings,
   type sizes and the 40pt rainbow grid match the app 1:1.
   ───────────────────────────────────────────────────────────── */

:root {
  --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --green:#34C759;
  --blue:#007AFF; --indigo:#5856D6; --purple:#AF52DE;
  --now:#2BA84A;               /* TodoView.nowGreen  hue .26 sat .72 br .66 */
  --ink:#1c1c1e; --sub:#6b6b70; --tert:#a1a1a6;
  --sep:#e5e5ea; --gray6:#f2f2f7; --gray5:#e5e5ea;
  --scale:0.80;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:#8a8a8e;
  font-family:-apple-system, "SF Pro Text", "Helvetica Neue", Inter, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* Korean set: Apple SD Gothic Neo on device, Noto Sans CJK KR when rendering
   here (apt install fonts-noto-cjk). Hangul needs a touch more leading and
   less negative tracking than the Latin set. */
body.ko, body.ko .screen {
  font-family:-apple-system, "Apple SD Gothic Neo", "Pretendard",
              "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
}
body.ko, body.ko .screen { word-break:keep-all; }
/* Hangul sets taller than Latin at the same size, so the Korean caption
   needs its own metrics to clear the device below it. */
body.ko .cap    { padding-top:42px; }
body.ko .cap h1 { letter-spacing:-0.02em; line-height:1.2; }
body.ko .cap p  { line-height:1.45; }
body.ko .row .title, body.ko .steprow .sname { line-height:1.35; }

/* ── artboard ─────────────────────────────────────────────── */
.shot {
  width:430px; height:932px; position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
}
.shot::after {                      /* soft rainbow wash at the bottom */
  content:""; position:absolute; inset:auto 0 0 0; height:340px;
  background:linear-gradient(180deg, transparent, var(--wash));
  opacity:.55; pointer-events:none;
}
.cap { padding:52px 38px 0; text-align:center; z-index:2; }
.cap h1 {
  font-size:36px; line-height:1.12; letter-spacing:-0.025em; font-weight:800;
  color:var(--capink);
}
.cap p {
  margin-top:14px; font-size:17px; line-height:1.42; font-weight:500;
  color:var(--capsub); letter-spacing:-0.01em;
}
.cap .kicker {
  display:inline-block; margin-bottom:14px; font-size:12px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--kick);
}

/* ── device ───────────────────────────────────────────────── */
.phone {
  position:absolute; left:50%; transform:translateX(-50%);
  width:337px; padding:11px; border-radius:50px;
  background:linear-gradient(160deg,#3a3a3f,#111114 30%,#141418 70%,#45454b);
  box-shadow:0 30px 64px rgba(0,0,0,.32), 0 6px 18px rgba(0,0,0,.20);
}
.phone .clip {
  width:315px; height:682px; overflow:hidden; border-radius:40px;
  background:#fff; position:relative;
}
.screen {
  width:393px; height:852px; transform:scale(var(--scale));
  transform-origin:top left; position:relative;
  display:flex; flex-direction:column;
  font-size:17px; color:var(--ink); background:#fff;
}

/* ── iOS chrome ───────────────────────────────────────────── */
.statusbar {
  height:59px; flex:none; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 32px 9px; font-size:15px; font-weight:600; letter-spacing:-0.01em;
}
.statusbar .icons { display:flex; align-items:center; gap:6px; }
.navbar {
  height:44px; flex:none; display:flex; align-items:center; justify-content:center;
  padding:0 16px; position:relative; font-size:17px; font-weight:600;
  letter-spacing:-0.02em; background:#fff;
}
.navbar .lead  { position:absolute; left:16px; color:var(--blue); font-weight:400; display:flex; align-items:center; gap:3px; }
.navbar .trail { position:absolute; right:16px; color:var(--blue); display:flex; align-items:center; gap:18px; }
.hairline { height:.5px; background:var(--sep); flex:none; }

.tabbar {
  height:83px; flex:none; display:flex; padding-top:8px;
  background:rgba(249,249,249,.94); border-top:.5px solid var(--sep);
  backdrop-filter:blur(20px);
}
.tabbar .tab {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; font-weight:500; color:#999a9e;
}
.tabbar .tab.on { color:var(--blue); }
.homebar {
  position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  width:140px; height:5px; border-radius:3px; background:#0c0c0e; opacity:.85;
}
.body { flex:1; overflow:hidden; position:relative; }
svg { display:block; }
</style>
</head>

<style>
/* ── 1. rainbow density grid ──────────────────────────────── */
.grid { padding-left:31px; }
.gridhead { display:flex; align-items:center; padding:8px 0; background:#fff; }
.gridhead .datecol { width:50px; text-align:center; font-size:10px; font-weight:700; color:var(--sub); }
.gridhead .lane { width:40px; text-align:center; font-size:12px; font-weight:700; color:var(--sub); }
.vrule { width:.5px; align-self:stretch; background:var(--sep); }
.drow { display:flex; align-items:stretch; background:#fff; }
.drow .datecol {
  width:50px; padding:2px 6px 2px 0; display:flex; flex-direction:column;
  align-items:flex-end; justify-content:center; gap:1px;
}
.drow .md { font-size:11px; font-weight:600; letter-spacing:-0.02em; }
.drow .wd { font-size:9px; color:var(--sub); }
.drow.today .datecol { background:rgba(0,122,255,.10); }
.drow.today .md { color:var(--blue); font-weight:700; }
.drow .wd.we { color:var(--red); }
.cell { width:40px; height:40px; padding:2px; background:var(--gray6); }
.drow.today .cell { background:rgba(0,122,255,.05); }
.cell > div { width:100%; height:100%; }
.blk { border:1.5px solid rgba(255,255,255,.6); }
.blk.mid { border-width:0 1.5px; border-color:rgba(255,255,255,.4); }
.pill { position:absolute; }
.todaytag {
  position:absolute; left:10px; font-size:9px; font-weight:700; color:#fff;
  background:var(--blue); padding:1px 5px; border-radius:5px; letter-spacing:.02em;
}
.fab {
  position:absolute; right:18px; bottom:148px; width:56px; height:56px; border-radius:28px;
  background:var(--blue); display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(0,122,255,.38);
}
.legend {
  position:absolute; left:0; right:0; bottom:83px; padding:9px 16px;
  background:rgba(255,255,255,.92); border-top:.5px solid var(--sep);
  display:flex; align-items:center; gap:10px; font-size:11px; color:var(--sub);
  backdrop-filter:blur(12px);
}
.legend .sw { width:13px; height:13px; border-radius:3px; }

/* ── 2. to-do list ────────────────────────────────────────── */
.list { background:var(--gray6); height:100%; overflow:hidden; }
.sechead {
  padding:18px 20px 6px; font-size:13px; font-weight:400; color:var(--sub);
  letter-spacing:-0.01em;
}
.card { margin:0 16px; border-radius:11px; overflow:hidden; background:#fff; }
.row {
  display:flex; align-items:center; gap:12px; padding:11px 14px; min-height:47px;
  border-bottom:.5px solid var(--sep); background:#fff;
}
.row:last-child { border-bottom:none; }
.row.marked { background:rgba(43,168,74,.16); }
.row.errand { background:rgba(107,107,112,.07); }
.row .txt { flex:1; min-width:0; }
.row .parent { font-size:11px; color:var(--tert); margin-bottom:2px; letter-spacing:-0.01em; }
.row .title { font-size:16px; letter-spacing:-0.02em; line-height:1.25; }
.row .title.done { color:var(--sub); text-decoration:line-through; }
.chev { color:#c4c4c8; flex:none; }
.badge {
  font-size:11px; font-weight:600; padding:2px 7px; border-radius:99px;
  letter-spacing:-0.01em; white-space:nowrap;
}
.badge.today { color:#fff; background:var(--blue); }
.badge.due   { color:var(--orange); background:rgba(255,149,0,.14); }
.badge.bolt  { color:var(--now); background:rgba(43,168,74,.16); display:inline-flex; align-items:center; gap:3px; }
.dot { width:10px; height:10px; border-radius:50%; flex:none; }
.footchips { display:flex; gap:14px; padding:10px 22px 0; font-size:13px; color:var(--sub); }
.footchips .chip { display:flex; align-items:center; gap:3px; font-weight:600; }
.addrow { display:flex; align-items:center; gap:12px; padding:12px 14px; background:rgba(107,107,112,.07); }
.caret { width:2px; height:20px; background:var(--blue); }

/* ── 3. two questions sheet ───────────────────────────────── */
.sheet {
  position:absolute; left:0; right:0; bottom:0; top:64px;
  background:var(--gray6); border-radius:14px 14px 0 0; overflow:hidden;
  box-shadow:0 -1px 0 rgba(0,0,0,.06);
}
.grabber { width:36px; height:5px; border-radius:3px; background:#c9c9ce; margin:6px auto 0; }
.qcard { margin:0 16px 14px; background:#fff; border-radius:11px; padding:16px; }
.qtext { font-size:15px; font-weight:600; letter-spacing:-0.02em; line-height:1.3; }
.qwhy { margin-top:6px; font-size:12px; color:var(--sub); line-height:1.42; }
.qsrc { font-size:11px; color:var(--tert); margin-top:4px; }
.seg {
  margin-top:12px; display:flex; padding:2px; background:var(--gray5);
  border-radius:9px; gap:2px;
}
.seg span {
  flex:1; text-align:center; padding:6px 0; font-size:13px; font-weight:600;
  border-radius:7px; color:var(--ink); letter-spacing:-0.01em;
}
.seg span.on { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); }
.verdict {
  margin:0 16px 16px; padding:15px 16px; border-radius:11px;
  background:rgba(43,168,74,.13); border:1px solid rgba(43,168,74,.26);
}
.verdict .vt { display:flex; align-items:center; gap:7px; font-size:15px; font-weight:700; color:var(--now); letter-spacing:-0.02em; }
.verdict .vs { margin-top:5px; font-size:13px; color:#3d6f4a; line-height:1.4; }

/* ── 4. steps detail ──────────────────────────────────────── */
.hero { padding:16px 20px 12px; background:#fff; }
.hero .htitle { font-size:22px; font-weight:700; letter-spacing:-0.03em; line-height:1.2; }
.hero .hmeta { margin-top:7px; display:flex; align-items:center; gap:9px; font-size:13px; color:var(--sub); }
.progbar { height:6px; border-radius:3px; background:var(--gray5); margin-top:12px; overflow:hidden; }

.switchrow {
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 14px; border-bottom:.5px solid var(--sep);
}
.segsmall { display:flex; padding:2px; background:var(--gray5); border-radius:8px; gap:2px; }
.segsmall { flex:none; }
.segsmall span { padding:4px 10px; font-size:12px; font-weight:600; border-radius:6px; white-space:nowrap; }
.segsmall span.on { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); }
.sumrow {
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 14px; font-size:15px; background:#fff;
}
.sumrow b { font-size:17px; letter-spacing:-0.02em; }

.homewall {
  height:100%; position:relative; overflow:hidden;
  background:

  margin:30px 26px 0; padding:15px 16px; border-radius:20px;

/* ── 6. what's free ───────────────────────────────────────── */

.freecard {
  border-radius:16px; padding:18px; background:#fff;

}
.freecard .tag {

.pgrid { display:grid; grid-template-columns:1fr 1fr; gap:9px 12px; margin-top:13px; }
.pgrid div { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); letter-spacing:-0.01em; }
.buybtn {

  display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600;
  letter-spacing:-0.02em;
}
.oncebadge { text-align:center; font-size:12px; color:var(--sub); margin-top:9px; }

/** the step donut — one slice per step, filled ones in blue. */
function donut(done, total, size, ringColor) {
  const R = 8.4, C = 2 * Math.PI * R, span = C / total, gap = Math.min(2.0, span * 0.18);

    const col = i < done ? (ringColor || '#007AFF') : 'rgba(120,120,128,.26)';

<script>
/* ═══ 1. THE RAINBOW — density grid ════════════════════════════
   Faithful to TimelineDensityView: 50pt date column, seven 40x40
   lane cells, lane colors from RainbowPalette, start/end cells at
   full opacity, middle days at .65, and the pale .20 span fill that
   runs on to the deadline (SpanFillBlock).                        */
const LANE = ['#FF3B30','#FF9500','#FFCC00','#34C759','#007AFF','#5856D6','#AF52DE'];
const TODAY_ROW = 2, ROWS = 18;
const EV = [
  {lane:0, s:0,  e:6,  w:[0,1,3,5,6]},
  {lane:1, s:2,  e:9,  w:[2,3,4,7,8,9]},
  {lane:2, s:1,  e:1,  w:[1]},
  {lane:2, s:8,  e:13, w:[8,9,11,13]},
  {lane:3, s:4,  e:17, w:[4,5,6,10,11,12,16,17]},
  {lane:4, s:6,  e:8,  w:[6,7,8]},
  {lane:5, s:0,  e:2,  w:[0,2]},
  {lane:5, s:12, e:15, w:[12,13,14,15]},
  {lane:6, s:9,  e:17, w:[9,10,14,15,17]},
];
function gridCell(row, lane) {
  const ev = EV.find(e => e.lane === lane && row >= e.s && row <= e.e);
  if (!ev) return '<div class="cell"><div></div></div>';
  const isStart = row === ev.s, isEnd = row === ev.e;
  const tl = isStart ? '4px' : '0', bl = isEnd ? '4px' : '0';
  const radius = `${tl} ${tl} ${bl} ${bl}`;
  if (ev.w.includes(row)) {
    const op = (isStart || isEnd) ? 1 : 0.65;
    const cls = (isStart || isEnd) ? 'blk' : 'blk mid';
    return `<div class="cell"><div class="${cls}" style="background:${LANE[lane]};opacity:${op};border-radius:${radius}"></div></div>`;
  }
  return `<div class="cell"><div style="background:${LANE[lane]};opacity:.20;border-radius:${radius}"></div></div>`;
}
function rainbowScreen() {
  const G = S.grid;
  const base = new Date(2026, 2, 2);            // Mon, Mar 2
  let rows = '';
  for (let r = 0; r < ROWS; r++) {
    const d = new Date(base.getTime() + r * 864e5);
    const dow = (d.getDay() + 6) % 7;           // 0 = Monday
    const weekend = dow >= 5;
    let cells = '';
    for (let l = 0; l < 7; l++) cells += gridCell(r, l);
    rows += `<div class="drow${r === TODAY_ROW ? ' today' : ''}">
        <div class="datecol">
          <span class="md">${G.day(d.getMonth() + 1, d.getDate())}</span>
          <span class="wd${weekend ? ' we' : ''}">${G.wd[dow]}</span>
        </div><div class="vrule"></div>${cells}
      </div><div class="hairline"></div>`;
  }
  let head = '';
  for (let l = 1; l <= 7; l++) head += `<div class="lane">${l}</div>`;
  return `${statusbar()}
    <div class="navbar">${G.title}
      <span class="trail">${ico('gear', 21, '#007AFF')}</span></div>
    <div class="hairline"></div>
    <div class="body">
      <div class="grid">
        <div class="gridhead"><div class="datecol">${G.date}</div><div class="vrule"></div>${head}</div>
        <div class="hairline"></div>${rows}
      </div>
      <div class="legend">
        <span class="sw" style="background:#5856D6"></span><span>${G.work}</span>
        <span class="sw" style="background:#5856D6;opacity:.2"></span><span>${G.span}</span>
      </div>
      <div class="fab">${ico('plus', 26, '#fff')}</div>
    </div>
    ${tabbar('rainbow')}<div class="homebar"></div>`;
}

/* ═══ shared row furniture ════════════════════════════════════ */
const boltCircle = () => `<span style="position:relative;display:flex;width:23px;height:23px;align-items:center;justify-content:center">
    ${ico('circle', 23, '#2BA84A')}<span style="position:absolute">${ico('bolt', 11, '#2BA84A', 'f')}</span></span>`;
const donutBolt = (d, t) => `<span style="position:relative;display:flex;width:23px;height:23px;align-items:center;justify-content:center">
    ${donut(d, t, 23)}<span style="position:absolute">${ico('bolt', 10, '#2BA84A', 'f')}</span></span>`;

/* ═══ 2. THE LIST — what you can start right now ═══════════════ */
function todoScreen() {
  const L = S.list;
  const MARK = {
    bolt:  () => [boltCircle(), 'marked'],
    donut: () => [donutBolt(1, 4), 'marked'],
    idle:  () => [ico('dashed', 23, '#8e8e93'), 'errand'],
    step:  () => [donut(3, 5, 23), ''],
    step0: () => [donut(0, 3, 23), ''],
    plain: () => [ico('circle', 23, '#8e8e93'), ''],
  };
  const rows = L.rows.map(([kind, parent, title, tail]) => {
    const [icon, cls] = MARK[kind]();
    let badges = '';
    if (tail === 'today') badges = `<span class="badge today">${L.todayBadge}</span>
        <span class="dot" style="background:#FF9500"></span>`;
    else if (tail.startsWith('due:')) badges = `<span class="badge due">${tail.slice(4)}</span>`;
    return `<div class="row ${cls}">${icon}
        <div class="txt">${parent ? `<div class="parent">${parent}</div>` : ''}
          <div class="title">${title}</div></div>
        ${badges}${ico('chev', 15, '#c4c4c8')}</div>`;
  }).join('');
  const done = L.done.map(([parent, title]) => `
    <div class="row">${ico('checkFill', 23, '#34C759', 'f')}
      <div class="txt">${parent ? `<div class="parent">${parent}</div>` : ''}
        <div class="title done">${title}</div></div></div>`).join('');

  return `${statusbar()}
    <div class="navbar">${L.title}
      <span class="trail">${ico('share', 19, '#007AFF')}${ico('plus', 20, '#007AFF')}</span></div>
    <div class="hairline"></div>
    <div class="body"><div class="list">
      <div class="sechead">${L.lede}</div>
      <div class="card">${rows}</div>
      <div class="footchips">
        <span class="chip" style="color:#2BA84A">${ico('bolt', 12, '#2BA84A', 'f')}3</span>
        <span class="chip">${ico('dashed', 12, '#6b6b70')}2</span>
        <span class="chip">${ico('clock', 12, '#6b6b70')}3</span>
        <span class="chip">${ico('check', 12, '#6b6b70')}2</span>
      </div>
      <div class="sechead">${L.doneHead}</div>
      <div class="card">${done}</div>
    </div></div>
    ${tabbar('todo')}<div class="homebar"></div>`;
}

/* ═══ 3. THE TWO QUESTIONS ═════════════════════════════════════
   FragmentQuestionRows: the app answers first, you only flip what
   it got wrong. Question text, why-line and citation all come from
   TodoSplitAdvisor.                                               */
function questionsScreen() {
  const Q = S.q;
  const seg = () => `<div class="seg"><span class="on">${Q.yes}</span><span>${Q.no}</span></div>`;
  const card = ([t, why, src]) => `<div class="qcard">
      <div class="qtext">${t}</div><div class="qwhy">${why}</div>
      <div class="qsrc">${src}</div>${seg()}</div>`;

  return `${statusbar()}
    <div class="navbar">${Q.task}<span class="lead">${ico('chevL', 17, '#007AFF')}</span></div>
    <div class="hairline"></div>
    <div class="body" style="background:#fff">
      <div class="hero">
        <div class="htitle">${Q.task}</div>
        <div class="hmeta">${ico('clock', 13, '#6b6b70')} ${S.steps.meta[0]}
          <span style="opacity:.4">&middot;</span> ${S.steps.meta[1]}</div>
        <div class="progbar"><i style="width:20%"></i></div>
      </div>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,.28)"></div>
      <div class="sheet">
        <div class="grabber"></div>
        <div class="navbar" style="background:transparent">${Q.sheet}
          <span class="trail" style="font-weight:600">${Q.done}</span></div>
        <div class="qcard" style="padding:14px 16px">
          <div style="font-size:17px;font-weight:600;letter-spacing:-.02em">${Q.step}</div>
          <div style="margin-top:5px;font-size:13px;color:var(--sub)">${Q.dur}</div>
        </div>
        <div class="sechead" style="padding:2px 20px 8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase">${Q.head}</div>
        ${card(Q.one)}${card(Q.two)}
        <div class="verdict">
          <div class="vt">${ico('bolt', 15, '#2BA84A', 'f')} ${Q.verdict}</div>
          <div class="vs">${Q.verdictSub}</div>
        </div>
        <div style="padding:0 20px;font-size:12px;color:var(--sub);line-height:1.45">${Q.note}</div>
        <div style="padding:16px 20px 0;font-size:15px;color:var(--blue)">${Q.revert}</div>
      </div>
    </div>`;
}

/* ═══ 4. STEPS — time adds up from the bottom ══════════════════ */
function stepsScreen() {
  const T = S.steps;
  const pill = `<span class="badge bolt">${ico('bolt', 9, '#2BA84A', 'f')}${T.pick}</span>`;
  const ICON = {
    done: () => ico('checkFill', 23, '#34C759', 'f'),
    bolt: () => boltCircle(),
    idle: () => ico('circle', 23, '#8e8e93'),
  };
  const rows = T.rows.map(([kind, name, reason, hrs]) => `
    <div class="steprow">${ICON[kind]()}
      <div class="st">
        <div class="sname${kind === 'done' ? ' done' : ''}">${name}${kind === 'bolt' ? ' ' + pill : ''}</div>
        ${reason ? `<div class="sreason">${reason}</div>` : ''}</div>
      <span class="hrs">${hrs}</span></div>`).join('');

  return `${statusbar()}
    <div class="navbar"><span class="lead">${ico('chevL', 17, '#007AFF')}${T.back}</span></div>
    <div class="hairline"></div>
    <div class="body" style="background:var(--gray6)"><div style="height:100%;overflow:hidden">
      <div class="hero">
        <div class="htitle">${T.task}</div>
        <div class="hmeta">${ico('clock', 13, '#6b6b70')} ${T.meta[0]}
          <span style="opacity:.4">&middot;</span> ${T.meta[1]}</div>
        <div class="progbar"><i style="width:20%"></i></div>
      </div>
      <div class="sechead">${T.head}</div>
      <div class="card">
        <div class="switchrow">
          <span style="font-size:15px;letter-spacing:-.02em">${T.order}</span>
          <div class="segsmall"><span>${T.inOrder}</span><span class="on">${T.anyOrder}</span></div>
        </div>${rows}
      </div>
      <div class="sechead">${T.sumNote}</div>
      <div class="card"><div class="sumrow"><span>${T.task}</span><b>${T.total}</b></div></div>
      <div class="sechead">${T.dragNote}</div>
    </div></div>
    ${tabbar('todo')}<div class="homebar"></div>`;
}
</script>
<script>
/* ═══ 5. WIDGETS — Home Screen & Lock Screen ═══════════════════ */
function widgetScreen() {
  const W = S.wg;
  const wline = (t, m) => `<div class="wline">${ico('bolt', 12, '#8CF0A6', 'f')}<span>${t}</span><span class="mins">${m}</span></div>`;

  // seven days x four lanes, one lane one colour — the grid's own rule
  const ON = [[0,0],[0,1],[0,3],[1,0],[1,1],[2,1],[2,2],[2,3],[3,0],[3,2],
              [4,0],[4,2],[4,3],[5,2],[5,3],[6,1],[6,3]];
  let mini = '';
  for (let c = 0; c < 7; c++) {
    let col = '';
    for (let r = 0; r < 4; r++) {
      const on = ON.some(([x, y]) => x === c && y === r);
      col += `<div class="c" style="${on ? `background:${LANE[r * 2]};opacity:.95` : ''}"></div>`;
    }
    mini += `<div class="col">${col}</div>`;
  }
  const RAINBOW_GRAD = 'linear-gradient(150deg,#FF3B30,#FF9500 24%,#FFCC00 40%,#34C759 56%,#007AFF 72%,#5856D6 86%,#AF52DE)';
  const GRADS = [
    [RAINBOW_GRAD, 'linear-gradient(150deg,#4d9bff,#1553c4)',
     'linear-gradient(150deg,#fdfbef,#f2e9c8)', 'linear-gradient(150deg,#ff5f6d,#c9184a)'],
    ['linear-gradient(150deg,#3ddc84,#0f9d58)', 'linear-gradient(150deg,#8e8e93,#48484a)',
     'linear-gradient(150deg,#ffd60a,#ff9f0a)', 'linear-gradient(150deg,#5e5ce6,#3634a3)'],
    ['linear-gradient(150deg,#ff375f,#c9184a)', 'linear-gradient(150deg,#64d2ff,#0a84ff)',
     'linear-gradient(150deg,#a2845e,#6b4f34)', 'linear-gradient(150deg,#30d158,#149c3d)'],
  ];
  const iconRow = (i) => `<div style="display:flex;justify-content:space-between;padding:0 26px;margin-top:22px">
      ${W.apps[i].map((label, j) => `<div style="text-align:center;width:60px">
        <div style="width:60px;height:60px;border-radius:15px;background:${GRADS[i][j]};box-shadow:0 4px 12px rgba(0,0,0,.32)"></div>
        <div style="margin-top:6px;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)">${label}</div></div>`).join('')}
    </div>`;

  return `<div class="body"><div class="homewall">
      ${statusbar(true)}
      <div class="wgrid" style="padding-top:14px">
        <div class="wg wide">
          <div class="wt">${ico('bolt', 12, '#8CF0A6', 'f')} ${W.bolt}</div>
          ${W.lines.map(([t, m]) => wline(t, m)).join('')}
        </div>
        <div class="wg">
          <div class="wt">${rainbowIco(13)} ${W.rainbow}</div>
          <div class="wmain">${W.today}</div>
          <div class="wsub">${W.load}</div>
          <div class="wgridmini">${mini}</div>
        </div>
        <div class="wg">
          <div class="wt">${ico('list', 12, '#fff')} ${W.todo}</div>
          <div class="wsub" style="margin-top:9px;opacity:.6">${W.parent}</div>
          <div class="wmain" style="margin-top:2px">${W.step}</div>
          <div class="wline" style="opacity:.72;font-size:12px">
            ${donut(1, 4, 14, '#fff')} ${W.progress}</div>
        </div>
      </div>
      ${iconRow(0)}${iconRow(1)}${iconRow(2)}
      <div style="position:absolute;left:0;right:0;bottom:112px;display:flex;justify-content:center;gap:7px">
        <span style="width:7px;height:7px;border-radius:50%;background:#fff"></span>
        <span style="width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)"></span>
      </div>
      <div style="position:absolute;left:12px;right:12px;bottom:22px;border-radius:30px;
                  background:rgba(255,255,255,.14);backdrop-filter:blur(24px);
                  border:.5px solid rgba(255,255,255,.14);padding:12px 0;
                  display:flex;justify-content:space-around">
        ${['linear-gradient(150deg,#3ddc84,#0f9d58)','linear-gradient(150deg,#4d9bff,#1553c4)',
           'linear-gradient(150deg,#ff9f0a,#e8590c)','linear-gradient(150deg,#5ac8fa,#0a84ff)']
          .map(g => `<div style="width:56px;height:56px;border-radius:14px;background:${g};box-shadow:0 4px 12px rgba(0,0,0,.3)"></div>`).join('')}
      </div>
      <div class="homebar" style="background:#fff;opacity:.9"></div>
    </div></div>`;
}

/* ═══ 6. WHAT'S FREE ═══════════════════════════════════════════ */
function priceScreen() {
  const P = S.price;
  const PRO_ICONS = [['bolt', 'f'], ['cal', ''], ['share', ''], ['chart', ''], ['clock', '']];
  const free = P.free.map(([k, v]) => `<div class="fline">${ico('check', 15, '#2BA84A')}
      <div><span class="k">${k}</span><div class="v">${v}</div></div></div>`).join('');
  const pro = P.pro.map((t, i) => `<div>${ico(PRO_ICONS[i][0], 15, '#007AFF', PRO_ICONS[i][1])}<span>${t}</span></div>`).join('');

  return `${statusbar()}
    <div class="navbar">${P.title}<span class="lead">${ico('chevL', 17, '#007AFF')}</span></div>
    <div class="hairline"></div>
    <div class="body"><div class="pricewrap">
      <div class="freecard">
        <span class="tag">${P.freeTag}</span>
        <h3>${P.freeHead}</h3>${free}
      </div>
      <div class="procard">
        <span class="tag2">${P.proTag}</span>
        <h3 style="font-size:19px;font-weight:700;margin-top:11px;letter-spacing:-0.03em">${P.proHead}</h3>
        <div class="pgrid">${pro}</div>
        <div class="buybtn">${P.buy}</div>
        <div class="oncebadge">${P.once}</div>
      </div>
    </div></div>
    ${tabbar('todo')}<div class="homebar"></div>`;
}

/* ═══ render the six artboards ═════════════════════════════════ */
const SKINS = [
  { bg:'linear-gradient(175deg,#f2f6ff 0%,#dfe8ff 100%)', wash:'rgba(0,122,255,.20)',
    ink:'#101534', sub:'#4b5578', kick:'#007AFF', screen:rainbowScreen },
  { bg:'linear-gradient(175deg,#f1fbf3 0%,#d9f2e0 100%)', wash:'rgba(43,168,74,.20)',
    ink:'#0d2a17', sub:'#3f6a4e', kick:'#2BA84A', screen:todoScreen },
  { bg:'linear-gradient(175deg,#fff8ee 0%,#ffe9cf 100%)', wash:'rgba(255,149,0,.22)',
    ink:'#3a2205', sub:'#7a5720', kick:'#E07800', screen:questionsScreen },
  { bg:'linear-gradient(175deg,#f3f2ff 0%,#e0deff 100%)', wash:'rgba(88,86,214,.22)',
    ink:'#16123d', sub:'#4d4a86', kick:'#5856D6', screen:stepsScreen },
  { bg:'linear-gradient(175deg,#1a1d33 0%,#0a0b14 100%)', wash:'rgba(140,240,166,.14)',
    ink:'#ffffff', sub:'#a9adcb', kick:'#8CF0A6', screen:widgetScreen },
  { bg:'linear-gradient(175deg,#f7f8fb 0%,#e8ebf2 100%)', wash:'rgba(52,199,89,.16)',
    ink:'#14171f', sub:'#575d6b', kick:'#34C759', screen:priceScreen },
];
document.getElementById('sheets').innerHTML = SKINS.map((skin, i) => {
  const [kicker, head, sub2] = S.shots[i];
  return shot({ ...skin, kicker, head, sub2, top:232, screen:skin.screen() });
}).join('');
</script>
</body>
</html>
