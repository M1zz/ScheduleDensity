# SwiftLint — 최소 규칙으로 시작한다 (클립키보드와 같은 방식).
#
# ⚠️ 의도적으로 셋만 켠다. 100개 가까운 파일에 전체 규칙을 걸면 수천 건 경고가 쏟아지고,
#    그러면 아무도 안 본다. 여기 있는 규칙은 "나오면 반드시 고친다"는 뜻이다.
#    규칙을 늘릴 땐 한 번에 하나씩, 기존 위반을 0으로 만든 뒤에 추가할 것.
#
# 실행: swiftlint            (경고 확인)
#       swiftlint --strict   (CI — 경고도 실패 처리)

only_rules:
  - force_try          # try! — 새로 들어오는 것을 막는다
  - force_unwrapping   # 옵셔널 강제 언랩. 크래시 1순위 원인
  - file_length        # 파일 비대화 방지

included:
  - ScheduleDensityApp
  - TodoWidget
  - TodoShare
# 시험 타깃은 뺀다 — 시험에서 강제 언랩은 "여기서 바로 실패하라"는 관용 표현이다.

excluded:
  - build
  - DerivedData
  - .build
  - docs
  - scripts
  - AppStore

file_length:
  # 지금 가장 긴 파일(TimelineDensityView ~2100줄)을 넘지 않게 막는 데서 시작한다.
  # 줄여 가면서 이 값도 내린다.
  warning: 1800
  error: 2500
  ignore_comment_only_lines: true

reporter: "xcode"
