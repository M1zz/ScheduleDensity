name: CI

# 푸시·PR 마다 빌드하고 단위 시험을 돌린다.
# 게이트 로직은 scripts/predeploy.sh 한 곳에만 둔다 — 여기서 명령을 복제하면 로컬과 CI 가 갈라진다.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 연속 푸시하면 이전 실행은 취소 — 러너 시간 절약
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 빌드 · 단위 시험
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전 확인
        run: xcodebuild -version

      # LeeoKit(공개 SPM 패키지)을 매번 새로 받지 않도록 캐시.
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Release 빌드 + 단위 시험. 시뮬레이터 고르기도 스크립트가 한다.
      # 시뮬레이터 빌드라 서명이 필요 없다.
      - name: 게이트 실행 (predeploy.sh)
        run: sh scripts/predeploy.sh

  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    # ⚠️ 처음에는 막지 않는다. 기존 강제 언랩 20건 · try! 1건이 남아 있어 지금 막으면
    #    모든 PR 이 빨간불이 되고 결국 무시하게 된다. 0으로 만든 뒤 이 줄을 지운다.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint 설치
        run: brew install swiftlint

      - name: SwiftLint 실행
        run: swiftlint --strict
